########################################
# QIDI X-Pro Retrofit
# BIGTREETECH Manta M8P V2.0
# Motion System
# Cartesian - Single Z
########################################


[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 40

endstop_pin: ^PF4

position_endstop: 0
position_max: 230

homing_speed: 50

[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 40

endstop_pin: ^PF3

position_endstop: 0
position_max: 150

homing_speed: 50

[stepper_z]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
microsteps: 16
rotation_distance: 8

endstop_pin: ^PF2

position_endstop: 0
position_max: 150
position_min: -5

homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3
