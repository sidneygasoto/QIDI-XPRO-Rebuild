########################################
# Trocas de ferramenta + purga
#
# A purga acontece na PRIMEIRA ativacao de cada
# ferramenta durante uma impressao (T0 ou T1),
# nunca em uso manual nem em ferramenta nao usada.
########################################

[gcode_macro _PURGE_STATE]
description: Estado da purga por ferramenta
variable_printing: 0
variable_t0_done: 0
variable_t1_done: 0
gcode:

########################################
# PURGE_LINE
# Purga a ferramenta ativa numa linha reta na
# traseira da mesa.
########################################

[gcode_macro PURGE_LINE]
description: Purga o bico ativo em uma linha na traseira da mesa
gcode:
    {% set X0 = params.X0|default(20)|float %}
    {% set X1 = params.X1|default(240)|float %}
    {% set Y  = params.Y|default(152)|float %}
    {% set Z  = params.Z|default(0.30)|float %}
    {% set E  = params.E|default(14)|float %}
    SAVE_GCODE_STATE NAME=_purge
    G90
    M83
    G0 Z{Z + 0.8} F3000
    G0 X{X0} Y{Y} F9000
    G0 Z{Z} F600
    G1 X{X1} E{E} F1200
    G0 Z{Z + 0.8} F3000
    RESTORE_GCODE_STATE NAME=_purge MOVE=1

########################################
# T0 / T1
########################################

[gcode_macro T0]
gcode:
    {% set st = printer["gcode_macro _PURGE_STATE"] %}
    {% set hot = printer.extruder.target > 0 and printer.extruder.temperature >= printer.extruder.target - 10 %}
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    {% if st.printing|int == 1 and st.t0_done|int == 0 and hot %}
        RESPOND MSG="T0: purgando bico direito"
        PURGE_LINE Y=152
        SET_GCODE_VARIABLE MACRO=_PURGE_STATE VARIABLE=t0_done VALUE=1
    {% endif %}

[gcode_macro T1]
gcode:
    {% set st = printer["gcode_macro _PURGE_STATE"] %}
    {% set hot = printer.extruder1.target > 0 and printer.extruder1.temperature >= printer.extruder1.target - 10 %}
    SET_GCODE_OFFSET X=33.600 Y=0.290 Z=0.00
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    {% if st.printing|int == 1 and st.t1_done|int == 0 and hot %}
        RESPOND MSG="T1: purgando bico esquerdo"
        PURGE_LINE Y=146
        SET_GCODE_VARIABLE MACRO=_PURGE_STATE VARIABLE=t1_done VALUE=1
    {% endif %}
