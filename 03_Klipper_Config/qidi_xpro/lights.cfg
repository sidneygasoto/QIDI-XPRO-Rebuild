[output_pin tool_light]
pin: PF8
value: 0
shutdown_value: 0

[output_pin cabin_light]
pin: PA4
value: 0
shutdown_value: 0

[gcode_macro TOOL_LIGHT_TOGGLE]
variable_state: 0
gcode:
    {% if printer["gcode_macro TOOL_LIGHT_TOGGLE"].state == 0 %}
        SET_PIN PIN=tool_light VALUE=1
        SET_GCODE_VARIABLE MACRO=TOOL_LIGHT_TOGGLE VARIABLE=state VALUE=1
    {% else %}
        SET_PIN PIN=tool_light VALUE=0
        SET_GCODE_VARIABLE MACRO=TOOL_LIGHT_TOGGLE VARIABLE=state VALUE=0
    {% endif %}

[gcode_macro CABIN_LIGHT_TOGGLE]
variable_state: 0
gcode:
    {% if printer["gcode_macro CABIN_LIGHT_TOGGLE"].state == 0 %}
        SET_PIN PIN=cabin_light VALUE=1
        SET_GCODE_VARIABLE MACRO=CABIN_LIGHT_TOGGLE VARIABLE=state VALUE=1
    {% else %}
        SET_PIN PIN=cabin_light VALUE=0
        SET_GCODE_VARIABLE MACRO=CABIN_LIGHT_TOGGLE VARIABLE=state VALUE=0
    {% endif %}

