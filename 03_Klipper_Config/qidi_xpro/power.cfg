########################################
# Relé de energia — BTT Relay V1.2
# Controle pelo PS_ON da Manta (PD14)
#
# NÃO ESTÁ ATIVO AINDA: falta incluir este arquivo no printer.cfg
#   [include qidi_xpro/power.cfg]
# e conferir a janela de 15-20 s do relé (ver 01_Docs/15_Relay_Energia.md)
########################################


[output_pin ps_on_pin]
pin: PD14
# nivel alto mantem o rele fechado
value: 1
# em caso de erro/shutdown do Klipper, mantem a energia:
# desligar a maquina por causa de um erro de G-code seria pior
shutdown_value: 1


########################################
# Desligar a impressora pelo painel
########################################

[gcode_macro POWER_OFF]
description: Desliga o host e corta a energia pelo relé
gcode:
    M118 Desligando - energia sera cortada em 15 a 20 s
    # inicia o temporizador do rele
    SET_PIN PIN=ps_on_pin VALUE=0
    # encerra o host de forma limpa
    {action_call_remote_method("shutdown_machine")}


########################################
# Rearmar o relé sem desligar
########################################

[gcode_macro POWER_ON]
description: Rearma o relé (mantém a energia ligada)
gcode:
    SET_PIN PIN=ps_on_pin VALUE=1
    M118 Relé rearmado
