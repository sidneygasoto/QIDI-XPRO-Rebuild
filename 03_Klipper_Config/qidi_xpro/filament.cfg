########################################
# Sensores de movimento de filamento
# IdeaFormer — 85 pulsos / 200 mm = 2,35 mm por pulso
#
# E0 -> END-STOP 5 -> PF0
# E1 -> END-STOP 6 -> PC15
#
# V alimentado com 5 V do proprio conector, sinal condicionado
# em hardware (ver 01_Docs/16_Sensores_Filamento.md)
########################################

[filament_motion_sensor fil_t0]
switch_pin: ^PF0
extruder: extruder
detection_length: 12.0
event_delay: 3.0
pause_delay: 0.8
pause_on_runout: True
runout_gcode:
    M118 Fim ou travamento de filamento no T0
insert_gcode:
    M118 Filamento reposto no T0

[filament_motion_sensor fil_t1]
switch_pin: ^PC15
extruder: extruder1
detection_length: 12.0
event_delay: 3.0
pause_delay: 0.8
pause_on_runout: True
runout_gcode:
    M118 Fim ou travamento de filamento no T1
insert_gcode:
    M118 Filamento reposto no T1
