########################################
# QIDI X-Pro Retrofit
# BIGTREETECH Manta M8P V2.0
# Motion System
# Cartesian - Single Z
########################################


[stepper_x]
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 34.06
endstop_pin: ^!PF4
#endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 265
position_min: -5
position_max: 265 
homing_speed: 80
second_homing_speed: 5
homing_retract_dist: 2

[stepper_y]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 34.06
endstop_pin: ^!PF3
#endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 155.3
position_min: -5
position_max: 156
homing_speed: 80
second_homing_speed: 5
homing_retract_dist: 2

[stepper_z]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
microsteps: 16
rotation_distance: 8
endstop_pin: ^!PF2
position_endstop: 158.4
position_max: 158.4
position_min: -2
homing_speed: 20
second_homing_speed: 5
homing_retract_dist: 2

