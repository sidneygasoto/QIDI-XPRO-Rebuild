########################################
# SHUTDOWN CB1
########################################
[gcode_macro SHUTDOWN_HOST]
description: Desliga a CB1 com segurança
gcode:
    {action_call_remote_method("shutdown_machine")}
[gcode_macro GO_HOME]
gcode:
    G0 X0 Y0 Z0

[gcode_macro GO_CENTER]
gcode:
    G0 X125 Y75

########################################
# PRINT_START
########################################

[gcode_macro PRINT_START]
description: Machine initialization before print
gcode:
    {% set BED = params.BED|default(0)|float %}

    # Reinicia o controle de purga por ferramenta (qidi_xpro/tools.cfg)
    SET_GCODE_VARIABLE MACRO=_PURGE_STATE VARIABLE=printing VALUE=1
    SET_GCODE_VARIABLE MACRO=_PURGE_STATE VARIABLE=t0_done VALUE=0
    SET_GCODE_VARIABLE MACRO=_PURGE_STATE VARIABLE=t1_done VALUE=0

    # Inicia aquecimento da mesa
    M140 S{BED}

    # Estado da máquina
    G90
    G21
    M83

    # Home
    G28

    # Aguarda a mesa atingir a temperatura
    M190 S{BED}

    # Aplica a compensacao de mesa medida a quente (01_Docs/07_Bed_Mesh.md)
    BED_MESH_PROFILE LOAD=default

    # Zera o extrusor
    G92 E0

########################################
# PRINT_END
########################################

[gcode_macro PRINT_END]
description: End print
gcode:
    # Encerra o controle de purga por ferramenta
    SET_GCODE_VARIABLE MACRO=_PURGE_STATE VARIABLE=printing VALUE=0

    G92 E0
    G1 E-2 F1800

    G91
    G1 Z10 F600
    G90

    G1 X0 Y150 F6000

    M107

    M104 S0
    M140 S0

    M84

########################################
# PAUSE
########################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
description: Pause print
gcode:
    BASE_PAUSE

    G91
    G1 Z10 F600
    G90
    G1 X0 Y150 F6000

########################################
# RESUME
########################################

[gcode_macro RESUME]
rename_existing: BASE_RESUME
description: Resume print
gcode:
    BASE_RESUME

########################################
# RESUME
########################################
[gcode_macro BED_CALIBRATE]
gcode:
    G28
    G90
    G0 X0 Y0 Z0.1
    BASE_PAUSE
    G0 Z5
    G0 X225
    G0 Z0.1
    BASE_PAUSE
    G0 Z5
    G0 X115 Y145
    G0 Z0.1
    BASE_PAUSE
    G0 Z10
    G0 X0 Y0
